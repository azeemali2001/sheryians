<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squid Game</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="logo">
            <img width="100px" style="color: white;" src="./logo.png" alt="">
        </div>
        <nav>
            <p>About</p>
            <p>Watch now</p>
            <p>Actors</p>
            <p>Contacts</p>
        </nav>
        <i class="ri-menu-fill"></i>
    </header>

    <main>
        <div class="left">
            <img width="200px" src="./logo.png" alt="">
            <div class="content">
                <p>Action / Thriller / Drama Series directed by Dong-hyuk Hwang</p>
                <p>Season 1: 9 Episodes</p>
            </div>
            <div class="btn">
                <div class="playNow">
                    <i class="ri-play-circle-fill"></i>
                    <p>Play Now</p>
                </div>
                <div class="watchTrailer">
                    <i class="ri-play-line"></i>
                    <p>Watch Trailer</p>
                </div>
            </div>
        </div>
        <h1 class="bgText leftText">GAME</h1>
        <h1 class="bgText rightText">SQUID</h1>
        <div class="right">
            <div class="scroll">
                <p>SCROLL</p>
                <div class="line"></div>
            </div>
            <img src="./main.png" alt="">
            <div class="social">
                <i class="ri-twitter-line"></i>
                <i class="ri-instagram-line"></i>
                <i class="ri-facebook-fill"></i>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="item">
                <img src="https://jonathangray.commarts.wisc.edu/wp-content/uploads/2023/08/sg-360x240.jpg" alt="">
            </div>
            <div class="item">
                <img src="https://i.pinimg.com/736x/95/2c/35/952c3511299488b0482772f33d2c0e57.jpg" alt="">
            </div>
            <div class="item">
                <img src="https://pt.quizur.com/_image?href=https%3A%2F%2Fimg.quizur.com%2Ff%2Fimg61855095260374.48070861.jpg%3FlastEdited%3D1636126888&w=600&h=600&f=webp"
                    alt="">
            </div>
        </div>
    </footer>
</body>

</html>
