<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <div class="container">
        <header class="header">
            <div class="hamburger">
                <div class="firstLine"></div>
                <div class="secondLine"></div>
                <div class="thirdLine"></div>
            </div>
            <img src="./logo.png" alt="">
            <div class="backlight">
                <i class="ri-sun-line"></i>
            </div>
        </header>
        <nav class="navbar">
            <div class="searchBar">
                <i class="ri-search-line"></i>
                <input type="text" placeholder="Search a Pokemon">
            </div>
            <div class="filter">
                <select>
                    <option value="" selected disabled>
                        Filter by types(1)
                    </option>
                </select>
                <button><i class="ri-sort-desc"></i></button>
            </div>
        </nav>
        <div class="parentBox">
            <div class="box1 card">
                <div class="cardHeader">
                    <p>#123</p>
                    <i class="ri-poker-hearts-line"></i>
                </div>
                <div class="hero">
                    <img src="./pikachu.png" alt="">
                </div>
                <div class="cardFooter">
                    <h3>Pikachu</h3>
                    <i class="ri-arrow-right-line"></i>
                </div>
            </div>
            <div class="box2 card">
                <div class="cardHeader">
                    <p>#123</p>
                    <i class="ri-poker-hearts-line"></i>
                </div>
                <div class="hero">
                    <img src="./Pawniard.png" alt="">
                </div>
                <div class="cardFooter">
                    <h3>Pawniard</h3>
                    <i class="ri-arrow-right-line"></i>
                </div>

            </div>
            <div class="box3 card">
                <div class="cardHeader">
                    <p>#123</p>
                    <i class="ri-poker-hearts-line"></i>
                </div>
                <div class="hero">
                    <img  src="./Houndoom.png" alt="">
                </div>
                <div class="cardFooter">
                    <h3>Houndoom</h3>
                    <i class="ri-arrow-right-line"></i>
                </div>

            </div>
            <div class="box4 card">
                <div class="cardHeader">
                    <p>#123</p>
                    <i class="ri-poker-hearts-line"></i>
                </div>
                <div class="hero">
                    <img src="./Inkay.png" alt="">
                </div>
                <div class="cardFooter">
                    <h3>Inkay</h3>
                    <i class="ri-arrow-right-line"></i>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
